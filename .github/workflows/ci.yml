name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.11.0, stable, nightly]
    steps:
      - uses: actions/checkout@v5

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Cache the wrt binary
        id: wrt-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wrt
          key: wrt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install the wrt CLI
        if: steps.wrt-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/pascalporedda/wrt-cli

      - name: Verify the toolchain
        run: |
          nvim --version | head -1
          wrt help | head -1
          git --version

      - name: Test on core Neovim only
        run: make test-bare

      - name: Test with snacks and telescope
        run: make test-all
